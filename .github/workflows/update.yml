name: Update groundwater data

on:
  schedule:
    - cron: '0 4 * * 1'   # Jeden Montag 4 Uhr UTC
  workflow_dispatch:        # Manueller Start über GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Cache groundwater ZIPs
        uses: actions/cache@v4
        with:
          path: ~/.grundwasser
          key: gw-zips-v2-${{ github.run_id }}
          restore-keys: gw-zips-v2-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Precompute data
        run: python precompute.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet || git commit -m "Update data $(date +%Y-%m-%d)"
          git push
